name: Update JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download c.json
        run: |
          echo "Downloading c.json from source..."
          curl -s -o c.json http://141.164.53.195/live/korea-live.json
          echo "Downloaded c.json"
          ls -la c.json

      - name: Merge with test.json
        run: |
          echo "Merging c.json and test.json..."
          python3 -c "
          import json
          
          # 读取 c.json（爬虫数据）
          with open('c.json', 'r', encoding='utf-8') as f:
              c_data = json.load(f)
          
          # 读取 test.json（自定义数据）
          with open('test.json', 'r', encoding='utf-8') as f:
              test_data = json.load(f)
          
          # 合并：test 数据追加到 c 数据后面
          # 保持与 c.json 相同的数组格式
          all_channels = c_data + test_data
          
          # 保存 channels.json（格式与 c.json 完全一致）
          with open('channels.json', 'w', encoding='utf-8') as f:
              json.dump(all_channels, f, ensure_ascii=False, indent=4)
          
          print(f'Created channels.json with {len(all_channels)} channels ({len(c_data)} c + {len(test_data)} test)')
          "
          ls -la channels.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add c.json channels.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update c.json and merge to channels.json"
          git push
