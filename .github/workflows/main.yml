name: Update JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download JSON
        run: |
          echo "Downloading from source..."
          curl -s -o channels.json http://141.164.53.195/live/korea-live.json
          echo "Downloaded channels.json"
          ls -la channels.json
          head -c 200 channels.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add channels.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update channels.json"
            git push
          fi
