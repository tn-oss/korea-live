name: Update JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Download JSON
        run: |
          curl -s -o channels.json http://141.164.53.195/live/korea-live.json
          echo "Downloaded channels.json"
          ls -la channels.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add channels.json
          git commit -m "Auto update channels.json from source" || echo "No changes"
          git push
