name: Update Korea Live JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch latest JSON
      run: |
        curl -s \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Referer: http://141.164.53.195/" \
          "http://141.164.53.195/live/korea-live.json" \
          -o channels.json
        
        if [ ! -s channels.json ]; then
          echo "Error: Failed to fetch JSON"
          exit 1
        fi
        
        echo "Fetched $(wc -c < channels.json) bytes"
        echo "Channels count: $(jq length channels.json)"
    
    - name: Update file via GitHub API
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Get current file info
        FILE_INFO=$(curl -s -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/contents/channels.json")
        
        CURRENT_SHA=$(echo "$FILE_INFO" | jq -r '.sha')
        echo "Current SHA: $CURRENT_SHA"
        
        # Encode file content
        CONTENT=$(base64 -w 0 channels.json)
        
        # Update file
        RESPONSE=$(curl -s -X PUT \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/channels.json" \
          -d "{
            \"message\": \"chore: auto update channels.json [skip ci]\",
            \"content\": \"$CONTENT\",
            \"sha\": \"$CURRENT_SHA\"
          }")
        
        echo "Response: $RESPONSE"
        
        # Check if update was successful
        if echo "$RESPONSE" | jq -e '.content' > /dev/null 2>&1; then
          echo "✅ Updated successfully"
        else
          echo "❌ Update failed"
          echo "$RESPONSE"
          exit 1
        fi