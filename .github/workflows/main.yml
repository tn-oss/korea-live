name: Update Korea Live JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: `${{ secrets.GITHUB_TOKEN }}`
        persist-credentials: true
      
    - name: Fetch latest JSON
      run: |
        curl -s \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Referer: http://141.164.53.195/" \
          "http://141.164.53.195/live/korea-live.json" \
          -o channels.json
        
        if [ ! -s channels.json ]; then
          echo "Error: Failed to fetch JSON"
          exit 1
        fi
        
        echo "Fetched $(wc -c < channels.json) bytes"
        echo "Channels count: $(jq length channels.json)"
      
    - name: Commit and push if changed
      run: |
        git config --local user.name 'GitHub Action'
        git config --local user.email 'action@github.com'
        git add channels.json
        git commit -m "chore: auto update channels.json [skip ci]" || echo "no changes"
        git push
