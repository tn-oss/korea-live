name: Update Korea Live JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch latest JSON
      run: |
        curl -s \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Referer: http://141.164.53.195/" \
          "http://141.164.53.195/live/korea-live.json" \
          -o channels.json
        
        if [ ! -s channels.json ]; then
          echo "Error: Failed to fetch JSON"
          exit 1
        fi
        
        echo "Fetched $(wc -c < channels.json) bytes"
        echo "Channels count: $(jq length channels.json)"
    
    - name: Get current file SHA
      id: get-sha
      run: |
        SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/channels.json" | jq -r '.sha')
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "Current SHA: $SHA"
    
    - name: Update channels.json
      run: |
        CONTENT=$(base64 -w 0 channels.json)
        SHA="${{ steps.get-sha.outputs.sha }}"
        
        curl -s -X PUT \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}/contents/channels.json" \
          -d "{\"message\":\"chore: auto update channels.json [skip ci]\",\"content\":\"$CONTENT\",\"sha\":\"$SHA\"}"
        
        echo "Updated channels.json successfully"