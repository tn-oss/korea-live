name: Update JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Download c.json
        run: |
          echo "Downloading c.json from source..."
          curl -s -o c.json http://141.164.53.195/live/korea-live.json
          echo "Downloaded c.json"
          ls -la c.json
          head -c 200 c.json

      - name: Merge to channels.json
        run: |
          echo "Merging c.json and test.json to channels.json..."
          python3 -c "
          import json
          
          # 读取 c.json（爬虫下载的数据）
          with open('c.json', 'r', encoding='utf-8') as f:
              c_data = json.load(f)
          
          # 读取 test.json（自定义测试数据）
          with open('test.json', 'r', encoding='utf-8') as f:
              test_data = json.load(f)
          
          # 合并数据
          channels_data = {
              'meta': {
                  'updateTime': '2026-10-28T08:33:00Z',
                  'source': 'http://141.164.53.195/live/korea-live.json',
                  'cChannels': len(c_data),
                  'testChannels': len(test_data)
              },
              'c': c_data,
              'test': test_data
          }
          
          # 保存 channels.json
          with open('channels.json', 'w', encoding='utf-8') as f:
              json.dump(channels_data, f, ensure_ascii=False, indent=4)
          
          print(f'Created channels.json with {len(c_data)} c channels and {len(test_data)} test channels')
          "
          ls -la channels.json

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add c.json channels.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto update c.json and merge to channels.json"
          git push
