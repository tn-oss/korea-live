name: Update Korea Live JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch latest JSON
      run: |
        curl -s \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
          -H "Referer: http://141.164.53.195/" \
          "http://141.164.53.195/live/korea-live.json" \
          -o channels.json
        
        if [ ! -s channels.json ]; then
          echo "Error: Failed to fetch JSON"
          exit 1
        fi
        
        echo "Fetched $(wc -c < channels.json) bytes"
        echo "Channels count: $(jq length channels.json)"
    
    - name: Update channels.json via GitHub API
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const content = fs.readFileSync('channels.json', 'utf8');
          
          // Get current file SHA
          const { data: fileInfo } = await github.rest.repos.getContent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'channels.json'
          });
          
          // Update the file
          await github.rest.repos.createOrUpdateFile({
            owner: context.repo.owner,
            repo: context.repo.repo,
            path: 'channels.json',
            message: 'chore: auto update channels.json [skip ci]',
            content: Buffer.from(content).toString('base64'),
            sha: fileInfo.sha
          });
          
          console.log('Updated channels.json successfully');